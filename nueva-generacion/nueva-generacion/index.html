<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro Cultural Nueva Generación</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<script>(function(){var t=localStorage.getItem('cc_tema')||'auto',d=t=='oscuro'||(t=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-bs-theme',d?'dark':'light')})()</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header class="navbar px-3" data-bs-theme="dark">
  <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="./">
    <img src="img/logo-oscuro.png" alt="" width="38" height="38">
    <span>Nueva Generación <small class="opacity-75 fw-normal d-none d-sm-inline">· Centro Cultural</small></span>
  </a>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <div class="dropdown">
      <button id="temaBtn" class="btn btn-sm btn-outline-light dropdown-toggle" data-bs-toggle="dropdown" aria-label="Cambiar tema de color">Tema</button>
      <ul id="temaMenu" class="dropdown-menu dropdown-menu-end">
        <li><button class="dropdown-item" data-t="claro" onclick="setTema('claro')">☀ Claro</button></li>
        <li><button class="dropdown-item" data-t="oscuro" onclick="setTema('oscuro')">☾ Oscuro</button></li>
        <li><button class="dropdown-item" data-t="auto" onclick="setTema('auto')">◐ Automático (según el sistema)</button></li>
      </ul>
    </div>
    <div id="barra" class="d-flex align-items-center gap-2 flex-wrap"></div>
  </div>
</header>
<div class="container-fluid">
  <div class="row shell">
    <nav id="nav" class="col-lg-2 p-3 border-end" aria-label="Módulos"></nav>
    <main class="col-lg-10 p-4"><div id="vista"></div></main>
  </div>
</div>
<div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="mt"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body" id="mb"></div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button><button class="btn btn-primary" id="mok"></button></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
